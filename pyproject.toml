[project]
name = "gemini-media-mcp"
dynamic = ["version"]
description = "Plan, generate, compose, and edit images and video with Gemini image models, Veo 3.1, and Gemini Omni, with a cost estimate before every call and an optional Gemini 4 Argon director that checks each take against your notes"
readme = "README.md"
keywords = [
    "mcp",
    "model-context-protocol",
    "gemini",
    "veo",
    "gemini-omni",
    "argon",
    "image-generation",
    "video-generation",
    "vertex-ai",
]
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    # FastMCP moved out of this import path in MCP 2.x. Keep the published
    # package on the compatible SDK until the server is migrated.
    "mcp>=1.23.1,<2",
    # 2.31.0 is the first release with GenerateContentConfig.automatic_continuation,
    # which image.py sets to keep one billed request per render, and it is past
    # the 2.30.1 minimum Gemini 4 Argon requires.
    "google-genai>=2.31.0",
    "pillow>=12.0.0",
    "aiohttp>=3.13.2",
    "google-cloud-storage>=3.6.0",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/CxOAGI/gemini-media-mcp"
Repository = "https://github.com/CxOAGI/gemini-media-mcp"
Issues = "https://github.com/CxOAGI/gemini-media-mcp/issues"

[project.scripts]
gemini-media-mcp = "src.__main__:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
    "licensecheck>=2025.1.0",
    "basedpyright>=1.25.0",
    "ruff>=0.14.8",
    "prek>=0.2.19",
]
